[theme]
base = "dark"
primaryColor = "#D4A359"
backgroundColor = "#0A0B09"
secondaryBackgroundColor = "#161814"
textColor = "#EDE4D3"
font = "sans serif"

[server]
fileWatcherType = "none"
headless = true
enableCORS = false
enableXsrfProtection = true
maxUploadSize = 5
maxMessageSize = 10

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
showErrorDetails = false

